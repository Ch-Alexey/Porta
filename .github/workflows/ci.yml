name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore Porta.slnx

      - name: Build
        run: dotnet build Porta.slnx -c Release --no-restore

      - name: Test (unit only)
        # Интеграционные тесты (Category=Integration) требуют multicast (mDNS) и
        # libmsquic (QUIC), которых нет на стандартном раннере — исключаем.
        run: dotnet test Porta.slnx -c Release --no-build --filter "Category!=Integration"

      - name: Vulnerable packages
        run: dotnet list Porta.slnx package --vulnerable --include-transitive
